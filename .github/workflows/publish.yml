name: Publish mirror

on:
  schedule:
    # Weekly refresh; only files missing from the verified store are downloaded.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      seed_release:
        description: "Optional release tag of this repository whose seed-*.tar assets are reused before any upstream (every file is still sha256-checked)"
        required: false
        default: ""
      allow_incomplete:
        description: "Publish the complete components even if some files are still unreachable"
        type: boolean
        default: true
      all_listings:
        description: "Send every maven-metadata.xml again, not only those of modules with new files"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - artifacts.lock
      - policy.json
      - scripts/mirror.py
      - .github/workflows/publish.yml

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

env:
  MIRROR_URL: https://maven.quickskin.net/
  PUBLISHER_URL: https://maven-upload.quickskin.net/
  # Where the mirror was published until it moved. It stays as it was, and is read before any upstream.
  LEGACY_PAGES_URL: https://the-plum-team.github.io/maven-mirror/

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      publishable: ${{ steps.fill.outputs.publishable }}
      complete: ${{ steps.fill.outputs.complete }}
      site_bytes: ${{ steps.fill.outputs.site_bytes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore verified store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: store
          key: verified-store-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: verified-store-

      - name: Download seed release
        if: ${{ inputs.seed_release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_TAG: ${{ inputs.seed_release }}
        run: |
          mkdir -p seed-download seed
          gh release download "$SEED_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'seed-*.tar' --dir seed-download
          python3 -I - seed-download seed <<'EOF'
          import pathlib, sys, tarfile
          source, dest = map(pathlib.Path, sys.argv[1:3])
          for archive in sorted(source.glob("seed-*.tar")):
              with tarfile.open(archive) as tar:
                  tar.extractall(dest, filter="data")
          EOF

      - name: Check the artifact list against the mods
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/mirror.py update-list --check --summary "$GITHUB_STEP_SUMMARY"

      - name: Fill and verify
        id: fill
        env:
          # Scheduled and push runs have no inputs. Expressions coerce null and false to 0, so
          # `inputs.allow_incomplete != false` would be false there; only a dispatch may opt out.
          ALLOW_INCOMPLETE: ${{ github.event_name != 'workflow_dispatch' || inputs.allow_incomplete }}
        run: |
          args=(--site site --store store --pages "$MIRROR_URL" --pages "$LEGACY_PAGES_URL" --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT")
          if [ -d seed ]; then args+=(--seed-maven seed); fi
          if [ "$ALLOW_INCOMPLETE" = "true" ]; then args+=(--allow-incomplete); fi
          python3 -I scripts/mirror.py fill "${args[@]}"

      - name: Save verified store
        if: ${{ always() && hashFiles('store/**') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: store
          key: verified-store-${{ github.run_id }}-${{ github.run_attempt }}

  publish:
    # The only job that may write to the mirror. It downloads nothing from an upstream: it builds the
    # site again from the store the build job verified and saved, checking every file against the
    # list once more, and sends what the mirror lacks. The publisher (worker/) accepts it because
    # the job's OpenID Connect token says it is this workflow, on main; no secret is involved.
    needs: build
    if: ${{ needs.build.outputs.publishable == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the store this run verified
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: store
          key: verified-store-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Build the site from the verified store
        run: python3 -I scripts/mirror.py fill --site site --store store --no-upstream --allow-incomplete --pages "$MIRROR_URL" --summary "$GITHUB_STEP_SUMMARY"

      - name: Publish what the mirror lacks
        env:
          ALL_LISTINGS: ${{ github.event_name == 'workflow_dispatch' && inputs.all_listings }}
        run: |
          args=(--site site --base "$MIRROR_URL" --endpoint "$PUBLISHER_URL" --summary "$GITHUB_STEP_SUMMARY")
          if [ "$ALL_LISTINGS" = "true" ]; then args+=(--all-listings); fi
          python3 -I scripts/mirror.py publish "${args[@]}"

  verify:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify published files over HTTPS
        run: python3 -I scripts/mirror.py verify-remote --base "$MIRROR_URL" --per-upstream 4
      - name: Report completeness
        if: ${{ needs.build.outputs.complete != 'true' }}
        run: |
          echo "::error::Some locked files could not be obtained yet; their components are not published. See the build job summary."
          exit 1

  size:
    # Runs after the publish so a large site still goes out; the failed run is the alert.
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Site stays under 90% of the bucket's free allowance
        env:
          SITE_BYTES: ${{ needs.build.outputs.site_bytes }}
        run: python3 -I scripts/mirror.py check-size --bytes "$SITE_BYTES" --annotate
