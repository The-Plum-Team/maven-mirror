name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -I -W ignore -m unittest discover -s tests
      - name: Artifact list matches policy.json and the mods
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/mirror.py update-list --check --summary "$GITHUB_STEP_SUMMARY"
